<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Phân tích & đánh giá chất lượng</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div id="banner-placeholder"></div>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Phân tích và đánh giá chất lượng</h1>
        <div class="subtitle">Tính điểm theo tiêu chí/KPI • Áp dụng phương pháp AHP</div>
      </div>
    </div>

    <div class="chart-grid">
      <!-- TÍNH ĐIỂM THEO KHẢO SÁT -->
      <div class="card">
        <h3>Yêu cầu 1: Tính điểm theo tiêu chí/KPI</h3>
        <div class="form-group">
          <label>Kỳ đánh giá</label>
          <select id="periodSelect"></select>
        </div>
        <div class="form-group">
          <label>Đối tượng đánh giá</label>
          <select id="targetSelect"></select>
        </div>
        <div class="form-group">
          <label>Khảo sát nguồn dữ liệu</label>
          <select id="surveySelect"></select>
        </div>
        <button class="btn btn-primary" onclick="computeScores()">Tính điểm</button>

        <div id="scoreResult" class="mt-16"></div>
      </div>

      <!-- AHP -->
      <div class="card">
        <h3>Yêu cầu 2: Áp dụng phương pháp AHP</h3>
        <div class="form-group">
          <label>Nhóm tiêu chí cần so sánh cặp</label>
          <select id="ahpGroupSelect" onchange="buildAhpMatrix()"></select>
        </div>
        <div id="ahpMatrixArea"></div>
        <button class="btn btn-primary mt-16" onclick="computeAhp()" id="ahpComputeBtn" style="display:none;">Tính trọng số AHP</button>
        <div id="ahpResult" class="mt-16"></div>
      </div>
    </div>
  </main>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  requireAuth(["ADMIN", "MANAGER"]);
  renderLayout("evaluation");

  let allCriteria = [];
  let allGroups = [];

  async function loadSelectors() {
    // Kỳ đánh giá và đối tượng đánh giá hiện lấy mã cứng minh họa (id=1) —
    // trong triển khai thực tế nên thêm API GET /api/evaluation-periods và /api/evaluation-targets
    document.getElementById("periodSelect").innerHTML = `<option value="1">Học kỳ hiện tại (ID: 1)</option>`;
    document.getElementById("targetSelect").innerHTML = `<option value="1">Đối tượng mặc định (ID: 1)</option>`;

    const surveys = await Api.get("/surveys");
    document.getElementById("surveySelect").innerHTML = surveys.map(s => `<option value="${s.surveyId}">${s.title}</option>`).join("");

    allGroups = await Api.get("/criteria-groups");
    document.getElementById("ahpGroupSelect").innerHTML = allGroups.map(g => `<option value="${g.groupId}">${g.groupName}</option>`).join("");

    allCriteria = await Api.get("/criteria");
    if (allGroups.length) buildAhpMatrix();
  }

  async function computeScores() {
    const payload = {
      periodId: parseInt(document.getElementById("periodSelect").value),
      targetId: parseInt(document.getElementById("targetSelect").value),
      surveyId: parseInt(document.getElementById("surveySelect").value),
    };
    try {
      const result = await Api.post("/evaluation/compute", payload);
      document.getElementById("scoreResult").innerHTML = `
        <table class="data-table">
          <thead><tr><th>Tiêu chí</th><th>Điểm thô</th><th>Trọng số</th><th>Điểm có trọng số</th></tr></thead>
          <tbody>
            ${result.details.map(d => `<tr><td>${d.criteriaName}</td><td>${d.rawScore}</td><td>${d.weight}</td><td>${d.weightedScore}</td></tr>`).join("")}
          </tbody>
        </table>
        <p><b>Tổng điểm có trọng số: ${result.totalWeightedScore}</b></p>
      `;
    } catch (e) { alert(e.message); }
  }

  function buildAhpMatrix() {
    const groupId = parseInt(document.getElementById("ahpGroupSelect").value);
    const items = allCriteria.filter(c => c.groupId === groupId);
    const area = document.getElementById("ahpMatrixArea");

    if (items.length < 2) {
      area.innerHTML = `<p style="color:#999;">Nhóm này cần tối thiểu 2 tiêu chí để so sánh cặp.</p>`;
      document.getElementById("ahpComputeBtn").style.display = "none";
      return;
    }

    let rows = "";
    for (let i = 0; i < items.length; i++) {
      for (let j = i + 1; j < items.length; j++) {
        rows += `
          <div class="form-group" data-a="${items[i].criteriaId}" data-b="${items[j].criteriaId}">
            <label>${items[i].criteriaName} <b>so với</b> ${items[j].criteriaName}</label>
            <select class="ahp-pair">
              <option value="9">9 - A cực kỳ quan trọng hơn B</option>
              <option value="7">7 - A quan trọng hơn nhiều so với B</option>
              <option value="5">5 - A quan trọng hơn B</option>
              <option value="3">3 - A hơi quan trọng hơn B</option>
              <option value="1" selected>1 - A và B quan trọng như nhau</option>
              <option value="0.333">1/3 - B hơi quan trọng hơn A</option>
              <option value="0.2">1/5 - B quan trọng hơn A</option>
              <option value="0.143">1/7 - B quan trọng hơn nhiều so với A</option>
              <option value="0.111">1/9 - B cực kỳ quan trọng hơn A</option>
            </select>
          </div>`;
      }
    }
    area.innerHTML = rows;
    document.getElementById("ahpComputeBtn").style.display = "inline-block";
  }

  async function computeAhp() {
    const groupId = parseInt(document.getElementById("ahpGroupSelect").value);
    const comparisons = Array.from(document.querySelectorAll("#ahpMatrixArea .form-group")).map(el => ({
      criteriaAId: parseInt(el.dataset.a),
      criteriaBId: parseInt(el.dataset.b),
      comparisonValue: parseFloat(el.querySelector(".ahp-pair").value),
    }));

    try {
      const result = await Api.post("/evaluation/ahp", { groupId, comparisons });
      document.getElementById("ahpResult").innerHTML = `
        <table class="data-table">
          <thead><tr><th>Tiêu chí</th><th>Trọng số AHP</th></tr></thead>
          <tbody>${result.weights.map(w => `<tr><td>${w.criteriaName}</td><td>${w.ahpWeight}</td></tr>`).join("")}</tbody>
        </table>
        <p>Tỷ số nhất quán (CR): <b>${result.consistencyRatio}</b>
          ${result.isConsistent
            ? '<span class="badge badge-success">Nhất quán - đã cập nhật trọng số</span>'
            : '<span class="badge badge-danger">Không nhất quán (CR ≥ 0.1) - vui lòng đánh giá lại</span>'}
        </p>`;
    } catch (e) { alert(e.message); }
  }

  loadSelectors();
</script>
</body>
</html>
