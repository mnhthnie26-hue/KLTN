<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>Đổi mật khẩu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
<div id="banner-placeholder"></div>
<div class="app-layout">
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1>Đổi mật khẩu</h1>
        <div class="subtitle">Cập nhật mật khẩu đăng nhập tài khoản của bạn</div>
      </div>
    </div>

    <div class="card" style="max-width:460px;">
      <div id="msgBox" class="success-message"></div>
      <div id="errBox" class="error-message"></div>
      <div class="form-group"><label>Mật khẩu hiện tại</label><input type="password" id="oldPassword" /></div>
      <div class="form-group"><label>Mật khẩu mới</label><input type="password" id="newPassword" /></div>
      <div class="form-group"><label>Xác nhận mật khẩu mới</label><input type="password" id="confirmPassword" /></div>
      <button class="btn btn-primary" onclick="changePassword()">Cập nhật mật khẩu</button>
    </div>
  </main>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  requireAuth();
  renderLayout("change-password");

  async function changePassword() {
    const oldPassword = document.getElementById("oldPassword").value;
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const msgBox = document.getElementById("msgBox");
    const errBox = document.getElementById("errBox");
    msgBox.style.display = "none";
    errBox.style.display = "none";

    if (newPassword !== confirmPassword) {
      errBox.textContent = "Mật khẩu xác nhận không khớp.";
      errBox.style.display = "block";
      return;
    }
    if (newPassword.length < 6) {
      errBox.textContent = "Mật khẩu mới phải có ít nhất 6 ký tự.";
      errBox.style.display = "block";
      return;
    }

    try {
      await Api.post("/auth/change-password", { oldPassword, newPassword });
      msgBox.textContent = "Đổi mật khẩu thành công.";
      msgBox.style.display = "block";
      document.getElementById("oldPassword").value = "";
      document.getElementById("newPassword").value = "";
      document.getElementById("confirmPassword").value = "";
    } catch (e) {
      errBox.textContent = e.message;
      errBox.style.display = "block";
    }
  }
</script>
</body>
</html>
